name: Bug
description: Relatar um problema no app, no painel ou na API
title: "fix: "
labels: ["bug"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Área
      options:
        - App do cidadão (mobile)
        - Painel da operadora
        - API
        - Banco de dados
        - Outro
    validations:
      required: true
  - type: textarea
    id: descricao
    attributes:
      label: O que aconteceu
      description: Descreva o problema com clareza.
    validations:
      required: true
  - type: textarea
    id: passos
    attributes:
      label: Passos para reproduzir
      placeholder: |
        1. Abrir...
        2. Tocar em...
        3. Ver o erro...
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: Comportamento esperado
    validations:
      required: true
  - type: input
    id: requisito
    attributes:
      label: Requisito ou regra relacionados
      placeholder: "RF-007, RN-006"
  - type: textarea
    id: ambiente
    attributes:
      label: Ambiente
      description: Dispositivo, sistema operacional e versão, versão do app, navegador (painel).
      placeholder: "Android 14, Pixel 7, Expo Go"
  - type: textarea
    id: evidencias
    attributes:
      label: Capturas de tela e logs
      description: Não inclua dados pessoais reais.
