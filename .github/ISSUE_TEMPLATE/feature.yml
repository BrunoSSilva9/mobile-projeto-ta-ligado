name: Funcionalidade
description: Propor ou detalhar uma funcionalidade
title: "feat: "
labels: ["enhancement"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Área
      options:
        - App do cidadão (mobile)
        - Painel da operadora
        - API
        - Banco de dados
        - Mais de uma
    validations:
      required: true
  - type: textarea
    id: historia
    attributes:
      label: História de usuário
      placeholder: "Como [persona], quero [ação] para [benefício]."
    validations:
      required: true
  - type: textarea
    id: criterios
    attributes:
      label: Critérios de aceitação
      placeholder: |
        Dado ...
        Quando ...
        Então ...
    validations:
      required: true
  - type: input
    id: requisitos
    attributes:
      label: Requisitos, regras e backlog relacionados
      placeholder: "RF-007, RN-006, B-013"
  - type: dropdown
    id: prioridade
    attributes:
      label: Prioridade (MoSCoW)
      options: [Must, Should, Could, Won't]
    validations:
      required: true
  - type: input
    id: figma
    attributes:
      label: Link do Figma (se houver)
  - type: textarea
    id: notas
    attributes:
      label: Notas técnicas e riscos
