name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 24

jobs:
  lint-e-tipos:
    name: Lint e tipos
    runs-on: ubuntu-latest
    env:
      # Necessário só para `prisma generate` (não conecta ao banco).
      DATABASE_URL: postgresql://taligado:taligado@localhost:5432/taligado
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check

  api:
    name: Testes da API
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: taligado
          POSTGRES_PASSWORD: taligado
          POSTGRES_DB: taligado_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taligado"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://taligado:taligado@localhost:5432/taligado_test
      JWT_SECRET: segredo-apenas-para-testes-ci
      SEED_OPERADOR_SENHA: senha-apenas-para-testes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # `migrate deploy` não gera o Prisma Client; o seed e os testes precisam dele.
      - name: Gera o Prisma Client
        run: npm run db:generate -w apps/api
      - name: Migrations e seed (valida o esquema inicial)
        run: |
          npm run db:deploy -w apps/api
          npm run db:seed -w apps/api
      - run: npm run test:coverage -w apps/api

  painel:
    name: Painel (testes e build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm test -w apps/painel
      - run: npm run build -w apps/painel

  mobile:
    name: App (testes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm test -w apps/mobile -- --ci
